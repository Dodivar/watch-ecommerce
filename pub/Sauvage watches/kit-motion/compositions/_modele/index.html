<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sauvage Modèle</title>
<!--
  Modèle de départ d'un motion Sauvage Watches (10 s) : accroche → montre → révélation crème → signature.
  Pour une nouvelle vidéo : copier ce dossier dans compositions/<nom-campagne>/, modifier TEXTES et MONTRE,
  puis ajuster ou ajouter des scènes. Tout le décor (fond, filigrane, grain, carte, boutons) vient de base/.
-->
<link rel="stylesheet" href="../../base/sauvage.css">
<style>
#s1{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#s1 .pill-outline{margin-bottom:48px}
#s1 .h{font-size:126px}
#s2{inset:0}
#s2 .title{left:0;right:0;top:80px;text-align:center;font-size:80px}
#s2 .card{top:330px}
#s3{inset:0;color:var(--green);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#s3 .eyebrow{color:var(--line);margin-bottom:34px}
#s3 .h{font-size:170px;line-height:.95}
#s3 .sub{font-size:48px;margin-top:54px;line-height:1.3;color:#1d3a2b}
</style>
</head>
<body>
<div id="stage">
  <div class="full bg-green"></div>
  <img class="bg-icon" src="../../assets/logos/icon_white.png" alt="">
  <svg class="full grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <div class="safe">
    <div id="s1" class="abs"><div class="pill-outline eyebrow" data-t="eyebrow"></div><div class="h" data-t="accroche"></div></div>
    <div id="s2" class="abs"><div class="title abs h" data-t="titreMontre"></div><div class="card" id="card"></div></div>
  </div>

  <div id="cream" class="full bg-cream">
    <div class="safe"><div id="s3" class="abs"><div class="eyebrow" data-t="revelationEyebrow"></div><div class="h" data-t="revelation"></div><div class="sub" data-t="revelationSub"></div></div></div>
  </div>

  <div id="green2" class="full" style="background:var(--green)">
    <div class="full bg-green"></div>
    <div class="safe">
      <div id="s4" class="abs endcard">
        <img class="logo" src="../../assets/logos/vert_white.png" alt="Sauvage Watches">
        <div class="rule"></div>
        <div class="url" data-t="url"></div>
        <div class="btn sm" data-t="cta"></div>
        <div class="small-caps" data-t="mention"></div>
      </div>
    </div>
  </div>
  <div id="flash" class="full flash"></div>
</div>

<script src="../../base/motion.js"></script>
<script>
const DURATION = 10;

/* ---------- contenu : seul bloc à modifier pour une campagne simple ----------
   « | » = retour à la ligne dans un titre (chaque mot apparaît en cascade). */
const TEXTES = {
  eyebrow: 'Nouveau · Sauvage Watches',
  accroche: 'Elle vous|attend.',
  titreMontre: 'Celle-ci pourrait|être la bonne.',
  revelationEyebrow: 'Sauvage Watches',
  revelation: 'Coup de|foudre.',
  revelationSub: 'Votre prochain match|se porte au poignet.',
  url: 'sauvage-watches.fr<b>/coup-de-foudre</b>',
  cta: 'Découvrir la montre',
  mention: "Montres de luxe d'occasion",
};
/* Fiche Supabase `watches` — ne jamais inventer un prix ou une référence. */
const MONTRE = { img: 'rolex-gmt-master-ii-batgirl-126710blnr', brand: 'Rolex', nick: 'Batgirl', model: 'GMT-Master II', ref: '126710BLNR', price: '15 000 €', year: 2023 };

/* ---------- construction ---------- */
const asWords = s => s.split('|').map(l => `<span class="line">${l.split(' ').map(w => `<span class="word">${w}</span>`).join(' ')}</span>`).join('');
$$('[data-t]').forEach(el => {
  const v = TEXTES[el.dataset.t];
  el.innerHTML = el.classList.contains('h') ? asWords(v) : el.dataset.t === 'revelationSub' ? v.split('|').map(l => `<span class="word">${l}</span>`).join('<br>') : v;
});
$('#s4 .btn').insertAdjacentHTML('beforeend', ' ' + Motion.SVG.arrow());
$('#card').innerHTML = `
  <div class="ph"><img src="../../assets/montres/${MONTRE.img}.png" alt=""><span class="year">${MONTRE.year}</span></div>
  <div class="meta"><div class="brand">${MONTRE.brand} · « ${MONTRE.nick} »</div><div class="model">${MONTRE.model}</div>
    <div class="row"><span class="price">${MONTRE.price}</span><span class="tag">Réf. ${MONTRE.ref}</span><span class="tag">Full set</span></div></div>`;

/* ---------- timeline (s) ---------- */
const T = { s1out: 2.0, card: 2.2, cardOut: 5.6, wipe: [5.7, 6.2], end: [7.6, 8.1] };

function render(t) {
  Motion.background(t);

  /* accroche */
  $('#s1').style.display = t < T.s1out + .4 ? 'flex' : 'none';
  const pk = eOut(P(t, .05, .45)), pko = P(t, T.s1out, T.s1out + .25);
  css($('#s1 .pill-outline'), { opacity: pk * (1 - pko), transform: `translateY(${(1 - pk) * 20 - pko * 30}px)` });
  words('#s1', t, .15, T.s1out, .1, .6);

  /* montre : la carte monte, s'incline légèrement, puis sort vers le haut */
  $('#s2').style.display = t > T.card - .1 && t < T.wipe[1] ? 'block' : 'none';
  words('#s2 .title', t, T.card, T.cardOut - .2, .06, .5);
  const kin = eOut5(P(t, T.card + .1, T.card + .8)), kout = eIn(P(t, T.cardOut - .3, T.cardOut + .1));
  const sway = Math.sin((t - T.card) * 1.6) * 1.5 * kin * (1 - kout);
  css($('#card'), { transform: `translateY(${(1 - kin) * 1100 - kout * 120}px) rotate(${sway}deg) scale(${1 + kout * .08})` });

  /* révélation crème (cercle) + éclair */
  const wk = eInOut(P(t, ...T.wipe));
  const cream = $('#cream');
  cream.style.display = wk > 0 && t < T.end[1] + .05 ? 'block' : 'none';
  cream.style.clipPath = `circle(${wk * 130}% at 50% 47%)`;
  const ek = eOut(P(t, T.wipe[0] + .35, T.wipe[0] + .75));
  css($('#s3 .eyebrow'), { opacity: ek, transform: `translateY(${(1 - ek) * 20}px)` });
  words('#s3 .h', t, T.wipe[0] + .4, 99, .1, .6);
  words('#s3 .sub', t, T.wipe[0] + 1.1, 99, .25, .55);
  css($('#s3'), { transform: `scale(${1 + P(t, T.wipe[0] + .3, T.end[0]) * .04})` });
  $('#flash').style.opacity = Math.sin(Math.PI * P(t, T.wipe[0] - .15, T.wipe[0] + .05)) * .7;

  /* signature */
  const gk = eInOut(P(t, ...T.end));
  const g = $('#green2');
  g.style.display = gk > 0 ? 'block' : 'none';
  g.style.clipPath = `inset(${(1 - gk) * 100}% 0 0 0 round ${(1 - gk) * 80}px ${(1 - gk) * 80}px 0 0)`;
  const e = T.end[0];
  const lk = eOut5(P(t, e + .3, e + .9));
  css($('#s4 .logo'), { opacity: lk, transform: `translateY(${(1 - lk) * 50}px) scale(${.92 + .08 * lk})` });
  css($('#s4 .rule'), { transform: `scaleX(${eOut(P(t, e + .55, e + .95))})` });
  const uk = eOut(P(t, e + .65, e + 1.05));
  css($('#s4 .url'), { opacity: uk, transform: `translateY(${(1 - uk) * 20}px)` });
  const bk = eBack(P(t, e + .8, e + 1.2));
  css($('#s4 .btn'), { opacity: clamp(bk), transform: `scale(${.8 + .2 * bk})` });
  css($('#s4 .small-caps'), { opacity: eOut(P(t, e + .95, e + 1.35)) * .9 });
}

Motion.start({ duration: DURATION, render });
</script>
</body>
</html>
