name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node ≥ 22.4 requis : `vitest.config.mjs` passe `--no-experimental-webstorage`
          # aux workers. Sur Node 20 le flag est inconnu, chaque worker meurt au
          # démarrage (« Worker exited unexpectedly ») et aucun test ne s'exécute.
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
