<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Segoe UI, Tahoma, Arial, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Stripe — créer le point de terminaison webhook et cocher les six événements</title>
  <desc id="desc">Reproduction schématique de la page Webhooks du tableau de bord Stripe : bouton « Ajouter un point de terminaison », champ URL renseigné avec l’adresse du backend suivie de l’identifiant de la boutique, et les six événements cochés — trois pour les paiements, trois pour les remboursements.</desc>
  <style>
    .win{fill:#ffffff;stroke:#dfe3e8;stroke-width:1}
    .chrome{fill:#eef1f4}
    .side{fill:#f7f9fc}
    .sep{stroke:#e3e8ee;stroke-width:1}
    .nav{fill:#5c6a7a;font-size:15px}
    .navOn{fill:#635bff;font-size:15px;font-weight:700}
    .h1{fill:#1a1f36;font-size:26px;font-weight:700}
    .lbl{fill:#1a1f36;font-size:15px}
    .mut{fill:#8792a2;font-size:14px}
    .grp{fill:#5c6a7a;font-size:12px;font-weight:700;letter-spacing:.6px}
    .mono{font-family:Consolas,Menlo,monospace;font-size:13.5px;fill:#1a1f36}
    .btnP{fill:#635bff}
    .btnPT{fill:#ffffff;font-size:13px;font-weight:600}
    .field{fill:#ffffff;stroke:#cfd7df}
    .cal{fill:#e03131}
    .calT{fill:#ffffff;font-size:15px;font-weight:700}
    .note{fill:#8792a2;font-size:12px;font-style:italic}
  </style>

  <rect class="win" x="8" y="8" width="944" height="660" rx="10"/>
  <path class="chrome" d="M8 18a10 10 0 0 1 10-10h924a10 10 0 0 1 10 10v30H8z"/>
  <circle cx="30" cy="30" r="5" fill="#ff5f57"/><circle cx="48" cy="30" r="5" fill="#febc2e"/><circle cx="66" cy="30" r="5" fill="#28c840"/>
  <rect x="90" y="18" width="520" height="24" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
  <text class="mono" x="104" y="35">https://dashboard.stripe.com/webhooks</text>
  <line class="sep" x1="8" y1="48" x2="952" y2="48"/>

  <path class="side" d="M8 48h162v610a10 10 0 0 1-10 10H18a10 10 0 0 1-10-10z"/>
  <line class="sep" x1="170" y1="48" x2="170" y2="668"/>
  <text class="nav" x="26" y="90">Accueil</text>
  <text class="nav" x="26" y="120">Transactions</text>
  <text class="nav" x="26" y="150">Produits</text>
  <line class="sep" x1="22" y1="172" x2="156" y2="172"/>
  <text class="navOn" x="26" y="202">Développeurs</text>
  <text class="nav" x="38" y="232">Clés API</text>
  <text class="navOn" x="38" y="262">Webhooks</text>

  <text class="h1" x="196" y="110">Webhooks</text>
  <rect class="btnP" x="700" y="86" width="226" height="32" rx="6"/>
  <text class="btnPT" x="813" y="106" text-anchor="middle">+ Ajouter un point de terminaison</text>

  <rect x="196" y="146" width="730" height="484" rx="10" fill="#ffffff" stroke="#e3e8ee"/>
  <text class="lbl" x="220" y="180" font-weight="700">Écouter les événements Stripe</text>
  <line class="sep" x1="196" y1="198" x2="926" y2="198"/>

  <text class="lbl" x="220" y="228">URL du point de terminaison</text>
  <rect class="field" x="220" y="240" width="682" height="34" rx="6"/>
  <text class="mono" x="234" y="262">https://watch-ecommerce-mp9l.onrender.com/api/stripe/webhook/<tspan fill="#c92a2a" font-weight="700">votre-boutique</tspan></text>
  <text class="mut" x="220" y="294" font-size="13">Adresse fournie par l’équipe technique — la recopier exactement, y compris la fin.</text>

  <text class="lbl" x="220" y="336">Événements à envoyer</text>
  <rect class="field" x="220" y="350" width="682" height="256" rx="6"/>

  <text class="grp" x="240" y="378">POUR LES PAIEMENTS</text>
  <rect x="240" y="392" width="16" height="16" rx="3" fill="#635bff"/>
  <path d="M244 400l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text class="mono" x="268" y="405">payment_intent.succeeded</text>
  <text class="mut" x="620" y="405" font-size="13">le paiement a abouti</text>

  <rect x="240" y="422" width="16" height="16" rx="3" fill="#635bff"/>
  <path d="M244 430l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text class="mono" x="268" y="435">payment_intent.payment_failed</text>
  <text class="mut" x="620" y="435" font-size="13">le paiement a échoué</text>

  <rect x="240" y="452" width="16" height="16" rx="3" fill="#635bff"/>
  <path d="M244 460l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text class="mono" x="268" y="465">payment_intent.canceled</text>
  <text class="mut" x="620" y="465" font-size="13">le paiement a été annulé</text>

  <line class="sep" x1="240" y1="488" x2="882" y2="488"/>
  <text class="grp" x="240" y="512">POUR LES REMBOURSEMENTS</text>
  <rect x="240" y="526" width="16" height="16" rx="3" fill="#635bff"/>
  <path d="M244 534l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text class="mono" x="268" y="539">charge.refunded</text>
  <text class="mut" x="620" y="539" font-size="13">un paiement a été remboursé</text>

  <rect x="240" y="556" width="16" height="16" rx="3" fill="#635bff"/>
  <path d="M244 564l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text class="mono" x="268" y="569">refund.created</text>
  <text class="mut" x="620" y="569" font-size="13">un remboursement est parti</text>

  <rect x="240" y="586" width="16" height="16" rx="3" fill="#635bff"/>
  <path d="M244 594l3 3 6-6" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text class="mono" x="268" y="599">refund.updated</text>
  <text class="mut" x="620" y="599" font-size="13">son statut a changé</text>

  <circle class="cal" cx="678" cy="102" r="15"/><text class="calT" x="678" y="108" text-anchor="middle">1</text>
  <circle class="cal" cx="204" cy="257" r="15"/><text class="calT" x="204" y="263" text-anchor="middle">2</text>
  <circle class="cal" cx="204" cy="430" r="15"/><text class="calT" x="204" y="436" text-anchor="middle">3</text>
  <circle class="cal" cx="204" cy="564" r="15"/><text class="calT" x="204" y="570" text-anchor="middle">4</text>

  <text class="note" x="196" y="658">Reproduction schématique — l’interface Stripe évolue ; les intitulés peuvent différer légèrement, l’emplacement reste le même.</text>
</svg>
