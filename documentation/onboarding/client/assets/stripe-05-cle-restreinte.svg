<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Segoe UI, Tahoma, Arial, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Stripe — créer la clé restreinte et ses trois permissions</title>
  <desc id="desc">Reproduction schématique du formulaire « Créer une clé restreinte » de Stripe : un champ de nom, puis une liste de ressources avec trois choix chacune — Aucune, Lecture, Écriture. Seules trois lignes sont modifiées : Balance sur Lecture, PaymentIntents sur Écriture, Refunds sur Écriture ; tout le reste est laissé sur Aucune.</desc>
  <style>
    .win{fill:#ffffff;stroke:#dfe3e8;stroke-width:1}
    .chrome{fill:#eef1f4}
    .sep{stroke:#e8ecf1;stroke-width:1}
    .h1{fill:#1a1f36;font-size:24px;font-weight:700}
    .lbl{fill:#1a1f36;font-size:15px}
    .res{fill:#1a1f36;font-size:15px}
    .why{fill:#8792a2;font-size:12.5px;font-style:italic}
    .th{fill:#8792a2;font-size:12px;font-weight:700;letter-spacing:.5px}
    .mut{fill:#8792a2;font-size:14px}
    .mono{font-family:Consolas,Menlo,monospace;font-size:13.5px;fill:#1a1f36}
    .field{fill:#ffffff;stroke:#cfd7df}
    .btnP{fill:#635bff}
    .btnPT{fill:#ffffff;font-size:13px;font-weight:600}
    .cal{fill:#e03131}
    .calT{fill:#ffffff;font-size:15px;font-weight:700}
    .note{fill:#8792a2;font-size:12px;font-style:italic}
  </style>

  <rect class="win" x="8" y="8" width="944" height="660" rx="10"/>
  <path class="chrome" d="M8 18a10 10 0 0 1 10-10h924a10 10 0 0 1 10 10v30H8z"/>
  <circle cx="30" cy="30" r="5" fill="#ff5f57"/><circle cx="48" cy="30" r="5" fill="#febc2e"/><circle cx="66" cy="30" r="5" fill="#28c840"/>
  <rect x="90" y="18" width="520" height="24" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
  <text class="mono" x="104" y="35">https://dashboard.stripe.com/apikeys/create</text>

  <text class="h1" x="196" y="96">Créer une clé restreinte</text>

  <text class="lbl" x="196" y="140">Nom de la clé</text>
  <rect class="field" x="196" y="152" width="430" height="34" rx="6"/>
  <text class="mono" x="210" y="174">Boutique en ligne — Ma Boutique</text>

  <text class="th" x="222" y="238">RESSOURCE</text>
  <text class="th" x="566" y="238" text-anchor="middle">AUCUNE</text>
  <text class="th" x="686" y="238" text-anchor="middle">LECTURE</text>
  <text class="th" x="806" y="238" text-anchor="middle">ÉCRITURE</text>

  <rect x="196" y="252" width="730" height="298" rx="8" fill="#ffffff" stroke="#e3e8ee"/>
  <rect x="197" y="286" width="728" height="40" fill="#f3f6fb"/>
  <text class="res" x="222" y="311" font-weight="700">Balance</text>
  <text class="why" x="303" y="311">vérifier que votre compte répond</text>
  <circle cx="566" cy="306" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <circle cx="686" cy="306" r="9" fill="#635bff"/><circle cx="686" cy="306" r="3.5" fill="#ffffff"/>
  <circle cx="806" cy="306" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <line class="sep" x1="197" y1="327" x2="925" y2="327"/>
  <text class="res" x="222" y="353">Charges</text>
  <circle cx="566" cy="348" r="9" fill="#635bff"/><circle cx="566" cy="348" r="3.5" fill="#ffffff"/>
  <circle cx="686" cy="348" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <circle cx="806" cy="348" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <line class="sep" x1="197" y1="369" x2="925" y2="369"/>
  <text class="res" x="222" y="395">Customers</text>
  <circle cx="566" cy="390" r="9" fill="#635bff"/><circle cx="566" cy="390" r="3.5" fill="#ffffff"/>
  <circle cx="686" cy="390" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <circle cx="806" cy="390" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <line class="sep" x1="197" y1="411" x2="925" y2="411"/>
  <rect x="197" y="412" width="728" height="40" fill="#f3f6fb"/>
  <text class="res" x="222" y="437" font-weight="700">PaymentIntents</text>
  <text class="why" x="366" y="437">encaisser les commandes</text>
  <circle cx="566" cy="432" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <circle cx="686" cy="432" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <circle cx="806" cy="432" r="9" fill="#635bff"/><circle cx="806" cy="432" r="3.5" fill="#ffffff"/>
  <line class="sep" x1="197" y1="453" x2="925" y2="453"/>
  <text class="res" x="222" y="479">Payouts</text>
  <circle cx="566" cy="474" r="9" fill="#635bff"/><circle cx="566" cy="474" r="3.5" fill="#ffffff"/>
  <circle cx="686" cy="474" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <circle cx="806" cy="474" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <line class="sep" x1="197" y1="495" x2="925" y2="495"/>
  <rect x="197" y="496" width="728" height="40" fill="#f3f6fb"/>
  <text class="res" x="222" y="521" font-weight="700">Refunds</text>
  <text class="why" x="303" y="521">rembourser depuis votre administration</text>
  <circle cx="566" cy="516" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <circle cx="686" cy="516" r="9" fill="#ffffff" stroke="#c3cad4" stroke-width="1.5"/>
  <circle cx="806" cy="516" r="9" fill="#635bff"/><circle cx="806" cy="516" r="3.5" fill="#ffffff"/>
  <line class="sep" x1="197" y1="537" x2="925" y2="537"/>
  <text class="mut" x="222" y="562" font-size="13.5" font-style="italic">… et toutes les autres ressources, laissées sur « Aucune »</text>

  <rect class="btnP" x="796" y="570" width="130" height="34" rx="6"/>
  <text class="btnPT" x="861" y="592" text-anchor="middle">Créer la clé</text>

  <circle class="cal" cx="181" cy="306" r="15"/><text class="calT" x="181" y="312" text-anchor="middle">1</text>
  <circle class="cal" cx="181" cy="432" r="15"/><text class="calT" x="181" y="438" text-anchor="middle">2</text>
  <circle class="cal" cx="181" cy="516" r="15"/><text class="calT" x="181" y="522" text-anchor="middle">3</text>

  <text class="note" x="196" y="638">Reproduction schématique — l’interface Stripe évolue ; les intitulés peuvent différer légèrement, l’emplacement reste le même.</text>
</svg>
