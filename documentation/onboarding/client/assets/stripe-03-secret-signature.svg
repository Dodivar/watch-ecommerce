<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Tahoma, Arial, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Stripe — révéler le secret de signature du webhook</title>
  <desc id="desc">Reproduction schématique de la fiche d’un point de terminaison webhook : l’URL, le secret de signature masqué et son bouton « Révéler », puis la valeur commençant par whsec_.</desc>
  <style>
    .win{fill:#ffffff;stroke:#dfe3e8;stroke-width:1}
    .chrome{fill:#eef1f4}
    .sep{stroke:#e3e8ee;stroke-width:1}
    .h1{fill:#1a1f36;font-size:22px;font-weight:700}
    .lbl{fill:#1a1f36;font-size:15px}
    .mut{fill:#8792a2;font-size:14px}
    .mono{font-family:Consolas,Menlo,monospace;font-size:13.5px;fill:#1a1f36}
    .btn{fill:#ffffff;stroke:#635bff}
    .btnT{fill:#635bff;font-size:13px;font-weight:600}
    .pill{fill:#e6f6ed}
    .pillT{fill:#1a7f4b;font-size:12px;font-weight:700}
    .cal{fill:#e03131}
    .calT{fill:#ffffff;font-size:15px;font-weight:700}
    .calL{fill:#c92a2a;font-size:14px;font-weight:600}
    .note{fill:#8792a2;font-size:12px;font-style:italic}
  </style>

  <rect class="win" x="8" y="8" width="944" height="520" rx="10"/>
  <path class="chrome" d="M8 18a10 10 0 0 1 10-10h924a10 10 0 0 1 10 10v30H8z"/>
  <circle cx="30" cy="30" r="5" fill="#ff5f57"/><circle cx="48" cy="30" r="5" fill="#febc2e"/><circle cx="66" cy="30" r="5" fill="#28c840"/>
  <rect x="90" y="18" width="520" height="24" rx="12" fill="#ffffff" stroke="#dfe3e8"/>
  <text class="mono" x="104" y="35">https://dashboard.stripe.com/webhooks/we_1Q…</text>
  <line class="sep" x1="8" y1="48" x2="952" y2="48"/>

  <text class="mut" x="40" y="86">Webhooks  ›  Point de terminaison</text>
  <text class="h1" x="40" y="122">watch-ecommerce-mp9l.onrender.com</text>
  <rect class="pill" x="40" y="138" width="86" height="22" rx="11"/>
  <text class="pillT" x="83" y="153" text-anchor="middle">ACTIF</text>

  <rect x="40" y="182" width="880" height="126" rx="10" fill="#ffffff" stroke="#e3e8ee"/>
  <text class="mut" x="64" y="212" font-size="13">URL DU POINT DE TERMINAISON</text>
  <text class="mono" x="64" y="238">https://watch-ecommerce-mp9l.onrender.com/api/stripe/webhook/<tspan fill="#c92a2a" font-weight="700">votre-boutique</tspan></text>
  <line class="sep" x1="40" y1="256" x2="920" y2="256"/>
  <text class="mut" x="64" y="284" font-size="13">SECRET DE SIGNATURE</text>
  <text class="mono" x="330" y="284" fill="#8792a2">whsec_•••••••••••••••••••</text>
  <rect class="btn" x="760" y="268" width="120" height="26" rx="4"/>
  <text class="btnT" x="820" y="285" text-anchor="middle">Révéler</text>

  <rect x="40" y="336" width="880" height="112" rx="10" fill="#f7f9fc" stroke="#e3e8ee"/>
  <text class="mut" x="64" y="366" font-size="13">APRÈS CLIC SUR « RÉVÉLER »</text>
  <rect x="64" y="380" width="700" height="32" rx="6" fill="#ffffff" stroke="#cfd7df"/>
  <text class="mono" x="78" y="402">whsec_4eC39HqLyjWDarjtT1zdp7dcW1nQxYzAbCdEf</text>
  <rect class="btn" x="780" y="380" width="100" height="32" rx="6" stroke="#d7dce3"/>
  <text class="btnT" x="830" y="401" text-anchor="middle" fill="#3c4257">Copier</text>
  <text class="mut" x="64" y="434" font-size="13">Cette valeur est propre à ce point de terminaison : un webhook supprimé puis recréé en produit une nouvelle.</text>

  <circle class="cal" cx="746" cy="281" r="15"/><text class="calT" x="746" y="287" text-anchor="middle">1</text>
  <circle class="cal" cx="48" cy="396" r="15"/><text class="calT" x="48" y="402" text-anchor="middle">2</text>

  <text class="note" x="40" y="500">Reproduction schématique — l’interface Stripe évolue ; les intitulés peuvent différer légèrement, l’emplacement reste le même.</text>
</svg>
