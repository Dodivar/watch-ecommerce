<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <style>
    .val { fill:#2c2412; font-size:26px; font-weight:700; }
    .cat { fill:#2c2412; font-size:22px; }
    .axis { fill:#8a8a8a; font-size:16px; }
    .ref { stroke:#b0a98f; stroke-width:1.5; stroke-dasharray:6 6; }
    .reflbl { fill:#9a916f; font-size:15px; }
  </style>
  <!-- baseline -->
  <line x1="90" y1="300" x2="720" y2="300" stroke="#d8d2c2" stroke-width="2"/>
  <!-- 50% reference line -->
  <line class="ref" x1="90" y1="175" x2="720" y2="175"/>
  <text class="reflbl" x="724" y="180">50 %</text>
  <!-- bars: 2020=45, 2023=58, 2026=66 (px/% = 2.5, baseline y=300) -->
  <rect x="125" y="187.5" width="110" height="112.5" rx="4" fill="#cdbf86"/>
  <text class="val" x="180" y="172" text-anchor="middle">45 %</text>
  <text class="cat" x="180" y="328" text-anchor="middle">2020</text>

  <rect x="325" y="155" width="110" height="145" rx="4" fill="#a8942f"/>
  <text class="val" x="380" y="140" text-anchor="middle">58 %</text>
  <text class="cat" x="380" y="328" text-anchor="middle">2023</text>

  <rect x="525" y="135" width="110" height="165" rx="4" fill="#7c6300"/>
  <text class="val" x="580" y="120" text-anchor="middle">66 %</text>
  <text class="cat" x="580" y="328" text-anchor="middle">2026</text>

  <text class="axis" x="90" y="352">Part des ventes e-commerce réalisées sur smartphone (m-commerce) — FR/EU</text>
</svg>
